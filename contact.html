<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./landing-image-asset/famr-favicon-32x32.svg" alt="">
  <title>FAMR Landing page</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./global.css">
  <link rel="stylesheet" href="./contact-css-files/contact.css">
  <link rel="stylesheet" href="./contact-css-files/contact-rs.css">
</head>

<body>
  <!-- Navigation section -->
  <nav>
    <div class="header-main">
      <div class="header-container">
        <div>
          <a class="hyperlink-container" href="index.html">
            <img src="./landing-image-asset/FAMR-LOGO.svg" alt="fmr-logo-header">
          </a>
        </div>
    
        <div class="menu">
          <div class="home-nav">
            <a class="hyperlink-container" href="index.html">Home</a>
          </div>
    
          <div class="about-nav">
            <a class="hyperlink-container" href="about.html">About</a>
          </div>
    
          <div class="contact-nav">
            <a class="hyperlink-container" href="contact.html">Contact</a>
          </div>
    
          <div class="faq-nav">
            <a class="hyperlink-container" href="faq.html">FAQ</a>
          </div>
        </div>
    
        <div class="header-button">
          <div>
            <button class="login-button">Login</button>
          </div>
  
          <div>
            <button class="reg-button">Register</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="mobile-nav">
    <div class="mobile-nav-container">
      <div>
        <img class="famr-logo" src="./landing-image-asset/FAMR-LOGO.svg" alt="nav-header-mobile">
      </div>

      <div class="menu-container">
        <img class="menu-icon" src="./landing-image-asset/menu.svg" alt="nav-menu">
      </div>
    </div>
  </div>

  <main>
    <section>
      <!-- Hero section iteration -->
      <div class="ct-hero-section">
        <div class="ct-text-section">
          <div class="farmer-tag-container">
            <p class="farmers-tag">Speak to us</p>
          </div>

          <div class="hero-header-container">
            <p class="hero-header">We are always available.</p>
          </div>
        </div>

        <div class="contact-section">
          <div class="ct-section-main">
            <div>
              <img src="./contact-image-asset/email.svg" alt="message-icon">
            </div>

            <div>
              <p class="ct-text">Support@famr.com</p>
            </div>

          </div>

          <div class="ct-section-main">
            <div>
              <img src="./contact-image-asset/phone.svg" alt="phone-icon">
            </div>
            <div>
              <p class="ct-text">+234-8977625490</p>
            </div>

          </div>
        </div>
        </div>
      </div>

      <!-- Form section iteration -->
       <div class="form-container">
          <form action="" method="post">
            <div class="name-container">
              <div class="fname-lname-input">
                <label class="name-category" for="fname"> First name</label>
                <input class="name-category-one" type="text" id="fname" name="fname" placeholder="Enter your first name">
              </div>

              <div class="fname-lname-input">
                <label for="lname"> Last name</label>
                <input class="name-category-one" type="text" id="lname" name="lname" placeholder="Enter your last name">
              </div>
            </div>

            <br> <br>
            <label for="emaddress">Email address</label>
            <input type="email" id="emaddress" name="emaddress" placeholder="Enter your email address">
            <br><br>
            <label for="pnumber">Mobile number</label>
            <input type="tel" id="pnumber" name="pnumber" placeholder="Enter your mobile number">
            <br><br>

            <div class="fname-lname-input">
              <label class="name-category" for="comment">Comment</label>
              <textarea class="name-category-one" name="comment" id="comment" placeholder="Enter comment"></textarea>
            </div>
            <br><br>

            <div>
              <button class="gs-button" type="Submit" value="submit">Submit</button>
            </div>
          </form>
       </div>

      <!-- Download App section iteration -->
      <div class="fourth-section">
        <div class="ft-image-container">
          <img class="ft-image" src="./landing-image-asset/SIXTH-LAYER-IMAGE.svg" alt="sixth-layer-image">
        </div>

        <div>
          <div class="f-section-container">
            <p class="f-section-head">Download the App</p>
            <p class="f-section-body">You can access FAMR through the App from your respective device App stores.</p>
          </div>

          <div class="gs-wt-button-container">
            <button class="gs-wt-button"><span class="right-icon"><img class="store-icon" src="./landing-image-asset/apple.svg" alt="apply-logo"></span>Get on iPhone</button>
            <button class="gs-wt-button"><span class="right-icon"><img class="store-icon" src="./landing-image-asset/android.svg" alt="android-logo"></span>Get on Android</button>
          </div>
        </div>
      </div>
    </section> 
  </main>

  <!-- Footer section iteration -->
  <footer>
    <div class="footer-main">
      <div class="footer-container">
        <a class="hyperlink-container" href="index.html">
          <div>
            <img src="./landing-image-asset/FAMR-LOGO.svg" alt="famr-logo-bottom">
          </div>
        </a>
  
        <div class="tc-p-section">
          <div>
            <a class="hyperlink-container" href="tc.html" class="tc-text-one">Terms and conditions</a>
          </div>
  
          <div>
            <a class="hyperlink-container" href="pp.html" class="tc-text">Privacy policy</a>
          </div>
        </div>
      </div>
    </div>
  </footer>
  
</body>
</html>
